
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.1.0b1"
description = "DFM + TOML -> HTML / Word 文档生成器"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "lxml>=5.0",
    # 数学：LaTeX -> MathML -> OMML（用 Word 自带的 MML2OMML.XSL）
    "latex2mathml>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
tmp_path_retention_policy = "none"
# 覆盖率门槛：低于 70% 直接失败
addopts = "--cov=docgen --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["src/docgen"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "assert_never",
]

[tool.ruff]
line-length = 100
# 该文档里含**作为规格的示例代码**，ruff format 会连 markdown 代码块一起重排、
# 改掉规格中的对齐——那是规格，不是待格式化代码，所以排除。
exclude = ["docs/development-manual.md"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# python-docx 不带类型标注（types-docx 未发布）
module = ["docx", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lxml 的 stubs 是可选包，CI 不必装
module = ["lxml", "lxml.*"]
ignore_missing_imports = true
