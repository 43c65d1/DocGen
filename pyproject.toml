
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.1.0"
description = "DFM -> IR -> HTML/docx 文档生成器（剪枝版 + Word 后端）"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    # 完整版（Hard Version）Word 后端
    "python-docx>=1.1",
    "lxml>=5.0",
    # 数学：LaTeX -> MathML（再经 MML2OMML.XSL -> OMML）
    "latex2mathml>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
tmp_path_retention_policy = "none"
# 覆盖率门槛（手册 §12：> 70%）
addopts = "--cov=docgen --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["src/docgen"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "assert_never",
]

[tool.ruff]
line-length = 100
# 沙箱内这些目录不可读：直接跳过，避免 ruff 扫描时刷权限警告
exclude = ["^/\\.(?:(?:venv|venv-dev|tmp|uv-cache|pytest-tmp|tmp-pytest|cache))/"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^\\.(tmp|uv-cache|pytest-tmp|tmp-pytest|venv|venv-dev)/"]

[[tool.mypy.overrides]]
# python-docx 不带类型标注（types-docx 未发布）
module = ["docx", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lxml 的 stubs 是可选包，CI 不必装
module = ["lxml", "lxml.*"]
ignore_missing_imports = true
